<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiArt AR - Painel de Controle e Gestão Master</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: #00FF00;
      font-size: 2rem;
    }

    header p {
      color: #888;
      font-size: 0.9rem;
    }

    .card {
      background-color: #141414;
      border: 2px solid #222;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      color: #00FF00;
      font-size: 1.2rem;
      margin-bottom: 15px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 15px;
      align-items: end;
    }

    @media (max-width: 900px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #00FF00;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #1c1c1c;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #00FF00;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #00FF00;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #00cc00;
    }

    .token-result {
      margin-top: 15px;
      background-color: #1c1c1c;
      border: 1px dashed #00FF00;
      padding: 12px;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    .token-result span {
      font-family: monospace;
      color: #00FF00;
      font-size: 1.1rem;
    }

    /* TABELA DE GERENCIAMENTO */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #222;
    }

    th {
      color: #888;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-ativo {
      background-color: #052605;
      color: #00FF00;
      border: 1px solid #00FF00;
    }

    .badge-expirado {
      background-color: #260505;
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
    }

    .actions-cell {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-renew {
      background-color: #1a2a1a;
      color: #00FF00;
      border: 1px solid #00FF00;
    }

    .btn-renew:hover {
      background-color: #00FF00;
      color: #000;
    }

    .btn-delete {
      background-color: #2a0a0a;
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
    }

    .btn-delete:hover {
      background-color: #ff4d4d;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>DigiArt AR</h1>
      <p>Painel de Controle e Gestão Master</p>
    </header>

    <!-- CARD DE CRIAÇÃO -->
    <div class="card">
      <h2>Novo Acesso / Revendedor</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="inputNome">Nome do Cliente:</label>
          <input type="text" id="inputNome" placeholder="Nome Completo">
        </div>
        <div class="form-group">
          <label for="inputEmail">E-mail de Acesso:</label>
          <input type="email" id="inputEmail" placeholder="cliente@email.com">
        </div>
        <div class="form-group">
          <label for="inputTelefone">Telefone / WhatsApp:</label>
          <input type="text" id="inputTelefone" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label for="selectPrazo">Tempo de Licença:</label>
          <select id="selectPrazo">
            <option value="dia_1">1 Dia (Teste)</option>
            <option value="mes_1">1 Mês</option>
            <option value="mes_2">2 Meses</option>
            <option value="mes_3">3 Meses</option>
            <option value="mes_4">4 Meses</option>
            <option value="mes_5">5 Meses</option>
            <option value="mes_6">6 Meses</option>
            <option value="mes_7">7 Meses</option>
            <option value="mes_8">8 Meses</option>
            <option value="mes_9">9 Meses</option>
            <option value="mes_10">10 Meses</option>
            <option value="mes_11">11 Meses</option>
            <option value="mes_12" selected>12 Meses (1 Ano)</option>
          </select>
        </div>
      </div>

      <div style="margin-top: 15px;">
        <button class="btn" id="btnGerar">GERAR ACESSO E TOKEN</button>
      </div>

      <div class="token-result" id="tokenResultBox">
        <div>
          <small style="color: #888; display:block;">Token Gerado:</small>
          <span id="txtTokenGerado">---</span>
        </div>
        <button class="btn-sm btn-renew" id="btnCopiarToken">Copiar Token</button>
      </div>
    </div>

    <!-- CARD DE GERENCIAMENTO (LISTA) -->
    <div class="card">
      <h2>Revendedores Cadastrados</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Revendedor / Contato</th>
              <th>Token</th>
              <th>Status / Validade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaRevendedores">
            <tr>
              <td colspan="4" style="text-align: center; color: #666;">Carregando revendedores...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9cempkBujGI2cOzpNLmMWzYEp1nrOogI",
      authDomain: "estacao-de-fotos.firebaseapp.com",
      projectId: "estacao-de-fotos",
      storageBucket: "estacao-de-fotos.firebasestorage.app",
      messagingSenderId: "227871054513",
      appId: "1:227871054513:web:8588dfa40f8a9da6166090",
      measurementId: "G-3CTFM7HHZQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const inputNome = document.getElementById("inputNome");
    const inputEmail = document.getElementById("inputEmail");
    const inputTelefone = document.getElementById("inputTelefone");
    const selectPrazo = document.getElementById("selectPrazo");
    const btnGerar = document.getElementById("btnGerar");
    const tokenResultBox = document.getElementById("tokenResultBox");
    const txtTokenGerado = document.getElementById("txtTokenGerado");
    const btnCopiarToken = document.getElementById("btnCopiarToken");
    const tabelaRevendedores = document.getElementById("tabelaRevendedores");

    function gerarTokenAleatorio() {
      const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let token = '';
      for (let i = 0; i < 8; i++) {
        token += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
      }
      return token;
    }

    function calcularMilisegundos(valorStr) {
      if (valorStr === "dia_1") {
        return 24 * 3600 * 1000; // 1 dia em ms
      } else {
        const meses = parseInt(valorStr.replace("mes_", ""));
        return meses * 30 * 24 * 3600 * 1000;
      }
    }

    async function carregarLista() {
      try {
        const querySnapshot = await getDocs(collection(db, "revendedores"));
        tabelaRevendedores.innerHTML = "";

        if (querySnapshot.empty) {
          tabelaRevendedores.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #666;">Nenhum revendedor cadastrado.</td></tr>`;
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const dados = docSnap.data();
          const email = docSnap.id;
          const nome = dados.nome || "Não informado";
          const telefone = dados.telefone || "Não informado";
          const token = dados.token;
          const expiraEm = dados.expiraEm;
          
          const agora = Date.now();
          const isAtivo = agora < expiraEm;
          const dataFormatada = new Date(expiraEm).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <strong>${nome}</strong><br>
              <small style="color: #00FF00;">${email}</small><br>
              <small style="color: #888;">📞 ${telefone}</small>
            </td>
            <td><code style="color: #00FF00; font-size: 1rem;">${token}</code></td>
            <td>
              <span class="badge ${isAtivo ? 'badge-ativo' : 'badge-expirado'}">
                ${isAtivo ? 'Ativo' : 'Expirado'}
              </span>
              <br><small style="color: #888; font-size: 0.75rem;">Expira em: ${dataFormatada}</small>
            </td>
            <td class="actions-cell">
              <button class="btn-sm btn-renew" onclick="renovarLicencaPrompt('${email}')">+ Renovar</button>
              <button class="btn-sm btn-delete" onclick="excluirRevendedor('${email}')">Excluir</button>
            </td>
          `;
          tabelaRevendedores.appendChild(tr);
        });

      } catch (err) {
        console.error("Erro ao carregar lista:", err);
        tabelaRevendedores.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff4d4d;">Erro ao carregar do banco de dados.</td></tr>`;
      }
    }

    // GERAR NOVO ACESSO
    btnGerar.addEventListener("click", async () => {
      const nome = inputNome.value.trim();
      const email = inputEmail.value.trim().toLowerCase();
      const telefone = inputTelefone.value.trim();
      const valorPrazo = selectPrazo.value;

      if (!nome) {
        alert("Digite o nome do revendedor!");
        inputNome.focus();
        return;
      }
      if (!email || !email.includes("@")) {
        alert("Digite um e-mail válido!");
        inputEmail.focus();
        return;
      }
      if (!telefone) {
        alert("Digite o telefone de contato!");
        inputTelefone.focus();
        return;
      }

      btnGerar.innerText = "GERANDO...";
      btnGerar.disabled = true;

      try {
        const token = gerarTokenAleatorio();
        const expiraEm = Date.now() + calcularMilisegundos(valorPrazo);

        await setDoc(doc(db, "revendedores", email), {
          nome: nome,
          telefone: telefone,
          token: token,
          expiraEm: expiraEm,
          criadoEm: Date.now()
        });

        txtTokenGerado.innerText = token;
        tokenResultBox.style.display = "flex";
        
        inputNome.value = "";
        inputEmail.value = "";
        inputTelefone.value = "";
        selectPrazo.value = "mes_12";
        
        carregarLista();

      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao gerar acesso no Firebase.");
      } finally {
        btnGerar.innerText = "GERAR ACESSO E TOKEN";
        btnGerar.disabled = false;
      }
    });

    btnCopiarToken.addEventListener("click", () => {
      navigator.clipboard.writeText(txtTokenGerado.innerText);
      btnCopiarToken.innerText = "Copiado!";
      setTimeout(() => btnCopiarToken.innerText = "Copiar Token", 2000);
    });

    // FUNÇÃO DE RENOVAÇÃO SUPORTANDO DIAS (ex: 1d) E MESES (ex: 1)
    window.renovarLicencaPrompt = async function(email) {
      const inputQtd = prompt("Quanto deseja adicionar para o revendedor " + email + "?\nDigite o número seguido de 'd' para dias ou apenas o número para meses\n(Ex: 1d para 1 dia, ou 1 para 1 mês)", "1d");
      if (!inputQtd) return;

      let msAdicionais = 0;
      const textoLimpo = inputQtd.trim().toLowerCase();

      if (textoLimpo.includes('d')) {
        const dias = parseInt(textoLimpo.replace('d', ''));
        if (isNaN(dias) || dias <= 0) {
          alert("Valor de dias inválido.");
          return;
        }
        msAdicionais = dias * 24 * 3600 * 1000;
      } else {
        const meses = parseInt(textoLimpo);
        if (isNaN(meses) || meses <= 0) {
          alert("Valor de meses inválido.");
          return;
        }
        msAdicionais = meses * 30 * 24 * 3600 * 1000;
      }

      try {
        const docRef = doc(db, "revendedores", email);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          alert("Revendedor não encontrado.");
          return;
        }

        const dados = docSnap.data();
        const validadeAtual = dados.expiraEm;
        const agora = Date.now();

        const baseCalculo = validadeAtual > agora ? validadeAtual : agora;
        const novoExpira = baseCalculo + msAdicionais;

        await updateDoc(docRef, {
          expiraEm: novoExpira
        });

        alert("Licença renovada com sucesso!");
        carregarLista();
      } catch (err) {
        console.error("Erro ao renovar:", err);
        alert("Erro ao atualizar licença.");
      }
    };

    window.excluirRevendedor = async function(email) {
      const confirma = confirm("Tem certeza que deseja excluir o acesso de " + email + "? Ele não conseguirá mais logar.");
      if (!confirma) return;

      try {
        await deleteDoc(doc(db, "revendedores", email));
        carregarLista();
      } catch (err) {
        console.error("Erro ao excluir:", err);
        alert("Erro ao excluir revendedor.");
      }
    };

    // CARREGA A TABELA AO ABRIR A PÁGINA
    window.addEventListener("DOMContentLoaded", () => {
      carregarLista();
    });
  </script>
</body>
  </html>
