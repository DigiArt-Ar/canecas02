<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Configurações para rodar como WebApp -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  
  <title>TV Player</title>
  
  <!-- HLS.js para vídeos m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase App & Firestore SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media screen and (orientation: portrait) {
      body {
        transform: rotate(90deg);
        transform-origin: bottom left;
        position: absolute;
        top: -100vw;
        left: 0;
        height: 100vw;
        width: 100vh;
      }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      position: absolute;
      top: 0;
      width: 100%;
      z-index: 10;
    }

    .device-id-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #aaaaaa;
    }

    .device-id-badge span {
      color: #00ff88;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .btn-back {
      background: none;
      border: none;
      color: #a0a0a0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: color 0.2s, transform 0.2s;
    }

    .btn-back:hover {
      color: #ffffff;
      transform: scale(1.05);
    }

    .main-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .app-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    .card-container {
      display: flex;
      gap: 25px;
    }

    .menu-card {
      background-color: #181818;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      width: 160px;
      height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.25s ease;
    }

    .menu-card:hover, .menu-card:focus {
      background-color: #222222;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-5px);
      outline: none;
    }

    .menu-card i {
      margin-bottom: 12px;
    }

    .card-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #cccccc;
    }

    .card-divider {
      width: 24px;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.2);
      margin-top: 8px;
    }

    .content-screen {
      display: none;
      flex: 1;
      margin-top: 60px;
      height: calc(100vh - 60px);
    }

    .sidebar {
      width: 280px;
      background: #141414;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .category-item {
      padding: 15px 20px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      font-size: 0.9rem;
      color: #aaa;
    }

    .category-item:hover, .category-item.active {
      background: #222;
      color: #fff;
      font-weight: bold;
    }

    .item-grid {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      align-content: start;
    }

    .channel-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .channel-item:hover {
      border-color: #555;
      background: #252525;
    }

    .player-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 100;
    }

    video {
      width: 100%;
      height: 100%;
    }

    .btn-player-back {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 101;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <header>
    <div class="device-id-badge">
      CÓDIGO: <span id="displayDeviceId">------</span>
    </div>

    <button class="btn-back" id="btnBackHeader" onclick="goBack()" style="display: none;">
      <i data-lucide="arrow-left" size="22"></i>
      <span>Voltar</span>
    </button>
  </header>

  <div class="main-screen" id="mainScreen">
    <h1 class="app-title">TV Player</h1>
    <div class="card-container">
      <div class="menu-card" tabindex="1" onclick="openCategory('channels')">
        <i data-lucide="tv" size="48"></i>
        <span class="card-label">CANAIS</span>
        <div class="card-divider"></div>
      </div>
      <div class="menu-card" tabindex="2" onclick="openCategory('movies')">
        <i data-lucide="clapperboard" size="48"></i>
        <span class="card-label">FILMES</span>
        <div class="card-divider"></div>
      </div>
      <div class="menu-card" tabindex="3" onclick="openCategory('series')">
        <i data-lucide="layers" size="48"></i>
        <span class="card-label">SÉRIES</span>
        <div class="card-divider"></div>
      </div>
    </div>
  </div>

  <div class="content-screen" id="contentScreen">
    <div class="sidebar" id="sidebar"></div>
    <div class="item-grid" id="itemGrid"></div>
  </div>

  <div class="player-overlay" id="playerOverlay">
    <button class="btn-back btn-player-back" onclick="closePlayer()">
      <i data-lucide="arrow-left" size="20"></i>
      <span>Voltar</span>
    </button>
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <script>
    lucide.createIcons();

    const firebaseConfig = {
      apiKey: "AIzaSyA_G6wZX1LGYBdnwMonMd-srnV_ktBPMNU",
      authDomain: "bolao-d2baf.firebaseapp.com",
      databaseURL: "https://bolao-d2baf-default-rtdb.firebaseio.com",
      projectId: "bolao-d2baf",
      storageBucket: "bolao-d2baf.firebasestorage.app",
      messagingSenderId: "955171998764",
      appId: "1:955171998764:web:2ccf8f2b6f23c300755589"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let playlistData = [];
    let currentScreen = 'main';

    document.addEventListener('click', function enableFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }, { once: true });

    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    function getDeviceId() {
      let id = localStorage.getItem('DEVICE_ID');
      if (!id) {
        id = Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('DEVICE_ID', id);
      }
      return id;
    }

    const deviceId = getDeviceId();
    document.getElementById('displayDeviceId').innerText = deviceId;

    function syncWithFirebase() {
      db.collection('dispositivos').doc(deviceId).onSnapshot(doc => {
        if (doc.exists && doc.data().m3uUrl) {
          const m3uUrl = doc.data().m3uUrl;
          console.log("URL M3U recebida do Firebase:", m3uUrl);
          fetchAndParseM3u(m3uUrl);
        } else {
          console.log("Aparelho aguardando cadastro no Painel Admin.");
        }
      }, err => {
        console.error("Erro ao conectar no Firebase:", err);
      });
    }

    // Baixar e processar o arquivo M3U via Cloudflare Worker próprio
    async function fetchAndParseM3u(url) {
      const myWorkerUrl = 'https://proxy-tv.djmauriciobarcellos.workers.dev/?url=';
      const targetUrl = myWorkerUrl + encodeURIComponent(url);

      try {
        console.log("Baixando M3U pelo Cloudflare Worker...");
        const response = await fetch(targetUrl);
        
        if (response.ok) {
          const rawContent = await response.text();
          
          // Exibe os primeiros caracteres recebidos para inspeção
          console.log("Resposta recebida do servidor:", rawContent.substring(0, 300));

          if (rawContent && rawContent.includes('#EXTINF')) {
            playlistData = parseM3U(rawContent);
            console.log("Lista carregada com sucesso! Total de itens:", playlistData.length);

            if (currentScreen === 'content') {
              openCategory('channels');
            }
            return;
          } else {
            console.error("Conteúdo recebido não possui a marcação #EXTINF.");
          }
        }
      } catch (e) {
        console.error("Erro na requisição via Worker:", e);
      }
    }

    // Processador da estrutura M3U / M3U_PLUS
    function parseM3U(m3uText) {
      if (!m3uText) return [];

      const lines = m3uText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      const items = [];
      let currentGroup = 'Geral';
      let currentName = '';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]+)"/) || line.match(/group-title=([^\s,]+)/);
          if (groupMatch) {
            currentGroup = groupMatch[1].replace(/"/g, '').trim();
          } else {
            currentGroup = 'Geral';
          }

          const nameIdx = line.lastIndexOf(',');
          if (nameIdx !== -1) {
            currentName = line.substring(nameIdx + 1).trim();
          } else {
            currentName = 'Sem Nome';
          }
        } else if (line && !line.startsWith('#')) {
          if (currentName) {
            items.push({
              name: currentName,
              group: currentGroup,
              url: line
            });
            currentName = '';
          }
        }
      }

      return items;
    }

    function goBack() {
      if (currentScreen === 'content') {
        document.getElementById('mainScreen').style.display = 'flex';
        document.getElementById('contentScreen').style.display = 'none';
        document.getElementById('btnBackHeader').style.display = 'none';
        currentScreen = 'main';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 10009 || e.keyCode === 27) {
        if (currentScreen === 'player') {
          closePlayer();
        } else if (currentScreen === 'content') {
          goBack();
        }
      }
    });

    function openCategory(type) {
      currentScreen = 'content';
      document.getElementById('mainScreen').style.display = 'none';
      document.getElementById('contentScreen').style.display = 'flex';
      document.getElementById('btnBackHeader').style.display = 'flex';

      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';

      const groups = [...new Set(playlistData.map(item => item.group))];

      if (groups.length === 0) {
        sidebar.innerHTML = '<div class="category-item">Aguardando lista...</div>';
        return;
      }

      groups.forEach((group, index) => {
        const div = document.createElement('div');
        div.className = `category-item ${index === 0 ? 'active' : ''}`;
        div.innerText = group;
        div.onclick = () => {
          document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          renderItems(group);
        };
        sidebar.appendChild(div);
      });

      renderItems(groups[0]);
    }

    function renderItems(groupName) {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';
      const filtered = playlistData.filter(item => item.group === groupName);

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.innerText = item.name;
        div.onclick = () => playStream(item.url);
        grid.appendChild(div);
      });
    }

    function playStream(url) {
      currentScreen = 'player';
      const overlay = document.getElementById('playerOverlay');
      const video = document.getElementById('videoPlayer');
      overlay.style.display = 'block';

      if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('output=ts'))) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
      } else {
        video.src = url;
      }
    }

    function closePlayer() {
      const overlay = document.getElementById('playerOverlay');
      const video = document.getElementById('videoPlayer');
      video.pause();
      video.src = '';
      overlay.style.display = 'none';
      currentScreen = 'content';
    }

    window.addEventListener('DOMContentLoaded', () => {
      syncWithFirebase();
    });
  </script>
</body>
</html>
