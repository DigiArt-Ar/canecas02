<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sorteador de Bingo</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; padding: 20px; }
        #btn-sortear { width: 200px; height: 200px; border-radius: 50%; border: none; background: #2ecc71; color: white; font-size: 4rem; cursor: pointer; box-shadow: 0 10px #27ae60; transition: transform 0.1s; }
        #btn-sortear:active { transform: translateY(5px); box-shadow: 0 5px #27ae60; }
        #historico { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-top: 30px; width: 100%; max-width: 600px; }
        .num-check { padding: 10px; background: #ddd; border-radius: 5px; text-align: center; }
        .sorteado { background: #3498db; color: white; }
        #btn-reset { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <button id="btn-sortear">SORTEAR</button>
    <button id="btn-reset">Resetar Jogo</button>

    <div id="historico"></div>

    <script>
        let sorteados = [];
        const btnSortear = document.getElementById('btn-sortear');
        const btnReset = document.getElementById('btn-reset');
        const historicoDiv = document.getElementById('historico');

        // Criar grade de 1 a 99
        for(let i=1; i<=99; i++) {
            let div = document.createElement('div');
            div.className = 'num-check';
            div.id = 'num-' + i;
            div.innerText = i;
            historicoDiv.appendChild(div);
        }

        btnSortear.addEventListener('click', () => {
            if(sorteados.length >= 99) { alert("Todos os números já foram sorteados!"); return; }
            
            let novoNum;
            do {
                novoNum = Math.floor(Math.random() * 99) + 1;
            } while (sorteados.includes(novoNum));

            sorteados.push(novoNum);
            btnSortear.innerText = novoNum;
            document.getElementById('num-' + novoNum).classList.add('sorteado');
            
            // Falar o número
            let msg = new SpeechSynthesisUtterance(novoNum.toString());
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
        });

        btnReset.addEventListener('click', () => {
            if(confirm("Tem certeza que deseja resetar o sorteio?")) {
                sorteados = [];
                btnSortear.innerText = "SORTEAR";
                document.querySelectorAll('.num-check').forEach(el => el.classList.remove('sorteado'));
            }
        });
    </script>
</body>
</html>
