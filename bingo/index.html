<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bingo em Família</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; background: #2c3e50; color: white; height: 100vh; margin: 0; align-items: center; justify-content: center; gap: 50px; }
        
        #painel-esquerda { text-align: center; width: 350px; }
        
        #btn-sortear { 
            width: 300px; height: 300px; border-radius: 50%; border: 8px solid #f1c40f; 
            background: #e67e22; color: white; cursor: pointer; 
            transition: all 0.3s; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            /* Garantimos que o conteúdo seja tratado como círculo */
            font-size: 5rem; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        /* Ajuste do texto inicial */
        #btn-sortear:not(.sorteado-ativo) { font-size: 3rem; }
        
        #btn-sortear:disabled { background: #95a5a6; cursor: not-allowed; border-color: #7f8c8d; }
        
        #grid-numeros { display: grid; grid-template-columns: repeat(10, 45px); gap: 8px; }
        .num { width: 45px; height: 45px; border-radius: 50%; background: #34495e; 
               display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .sorteado { background: #2ecc71; color: #fff; transform: scale(1.1); transition: 0.3s; }
        
        #btn-reset { margin-top: 20px; padding: 10px 25px; cursor: pointer; background: #c0392b; color: white; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="painel-esquerda">
        <h1>BINGO EM FAMÍLIA</h1>
        <button id="btn-sortear">SORTEAR</button>
        <br>
        <button id="btn-reset">REINICIAR SORTEIO</button>
    </div>

    <div id="grid-numeros"></div>

    <script>
        // Carrega dados salvos
        let sorteados = JSON.parse(localStorage.getItem('bingo_sorteados')) || [];
        let sorteando = false;
        const btnSortear = document.getElementById('btn-sortear');
        const grid = document.getElementById('grid-numeros');

        // Cria a grade e restaura o estado
        for(let i=1; i<=99; i++) {
            let div = document.createElement('div');
            div.className = 'num';
            div.id = 'num-' + i;
            div.innerText = i;
            if (sorteados.includes(i)) {
                div.classList.add('sorteado');
                btnSortear.innerText = i;
                btnSortear.classList.add('sorteado-ativo');
            }
            grid.appendChild(div);
        }

        btnSortear.addEventListener('click', () => {
            if(sorteando || sorteados.length >= 99) return;
            
            sorteando = true;
            btnSortear.disabled = true;

            let contagem = 0;
            let interval = setInterval(() => {
                btnSortear.innerText = Math.floor(Math.random() * 99) + 1;
                btnSortear.classList.remove('sorteado-ativo');
                contagem++;
                if(contagem > 5) {
                    clearInterval(interval);
                    finalizarSorteio();
                }
            }, 150);
        });

        function finalizarSorteio() {
            let novoNum;
            do { novoNum = Math.floor(Math.random() * 99) + 1; } while (sorteados.includes(novoNum));

            sorteados.push(novoNum);
            localStorage.setItem('bingo_sorteados', JSON.stringify(sorteados));
            
            btnSortear.innerText = novoNum;
            btnSortear.classList.add('sorteado-ativo');
            document.getElementById('num-' + novoNum).classList.add('sorteado');
            
            let msg = new SpeechSynthesisUtterance(novoNum.toString());
            msg.lang = 'pt-BR';
            
            msg.onend = () => {
                sorteando = false;
                btnSortear.disabled = false;
            };

            window.speechSynthesis.speak(msg);
        }

        document.getElementById('btn-reset').addEventListener('click', () => {
            if(confirm("Tem certeza absoluta que deseja reiniciar a partida?")) {
                sorteados = [];
                localStorage.removeItem('bingo_sorteados');
                btnSortear.innerText = "SORTEAR";
                btnSortear.classList.remove('sorteado-ativo');
                document.querySelectorAll('.num').forEach(el => el.classList.remove('sorteado'));
            }
        });
    </script>
</body>
</html>
