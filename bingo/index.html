<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo em Família</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Arial', sans-serif; background: #2c3e50; color: white; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Layout fixo horizontal */
        .app-container { display: flex; width: 100vw; height: 100vh; padding: 10px; gap: 20px; align-items: center; }

        /* Esquerda: 30% da tela */
        .col-left { width: 30%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Direita: 70% da tela */
        .col-right { width: 70%; display: flex; flex-direction: column; align-items: center; }

        #btn-sortear { 
            width: 20vh; height: 20vh; border-radius: 50%; border: 6px solid #f1c40f; 
            background: #e67e22; color: white; font-size: 8vh; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        #grid-numeros { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; 
            width: 100%; height: 80vh;
        }
        .num { 
            background: #34495e; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; font-size: 1.5vh;
        }
        .sorteado { background: #2ecc71; color: white; transform: scale(1.1); }
        
        #btn-reset { margin-top: 10px; padding: 10px; background: #c0392b; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="col-left">
            <h2 style="margin:0">BINGO</h2>
            <button id="btn-sortear">?</button>
            <button id="btn-reset">REINICIAR</button>
        </div>
        <div class="col-right">
            <div id="grid-numeros"></div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid-numeros');
        const btn = document.getElementById('btn-sortear');
        let sorteados = [];

        // Gera grade
        for(let i=1; i<=99; i++) {
            let d = document.createElement('div');
            d.className = 'num'; d.id = 'n'+i; d.innerText = i;
            grid.appendChild(d);
        }

        btn.addEventListener('click', () => {
            let num = Math.floor(Math.random() * 99) + 1;
            while(sorteados.includes(num)) num = Math.floor(Math.random() * 99) + 1;
            sorteados.push(num);
            btn.innerText = num;
            document.getElementById('n'+num).classList.add('sorteado');
            
            let msg = new SpeechSynthesisUtterance(num.toString());
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
        });

        document.getElementById('btn-reset').onclick = () => {
            if(confirm("Reiniciar?")) location.reload();
        };
    </script>
</body>
</html>
