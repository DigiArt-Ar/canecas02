<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo em Família</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; background: #2c3e50; color: white; 
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; /* Evita rolagem */
        }
        
        /* Container principal horizontal */
        .container { display: flex; width: 95vw; height: 90vh; align-items: center; justify-content: space-around; }

        /* Coluna da Esquerda (Sorteio) */
        #painel-esquerda { text-align: center; flex: 1; }
        #btn-sortear { 
            width: 30vw; height: 30vw; max-width: 300px; max-height: 300px;
            border-radius: 50%; border: 8px solid #f1c40f; 
            background: #e67e22; color: white; font-size: 6rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #btn-sortear:disabled { background: #95a5a6; }

        /* Coluna da Direita (Grade) */
        #painel-direita { display: flex; flex-direction: column; align-items: center; flex: 2; }
        #grid-numeros { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; 
            width: 100%; max-width: 600px;
        }
        .num { 
            aspect-ratio: 1/1; background: #34495e; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1vw;
        }
        .sorteado { background: #2ecc71; color: white; transform: scale(1.1); }

        #btn-reset { margin-top: 20px; padding: 15px 30px; background: #c0392b; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <div id="painel-esquerda">
            <h1>BINGO EM FAMÍLIA</h1>
            <button id="btn-sortear">?</button>
        </div>

        <div id="painel-direita">
            <div id="grid-numeros"></div>
            <button id="btn-reset">REINICIAR SORTEIO</button>
        </div>
    </div>

    <script>
        let sorteados = [];
        let sorteando = false;
        const btnSortear = document.getElementById('btn-sortear');
        const grid = document.getElementById('grid-numeros');

        for(let i=1; i<=99; i++) {
            let div = document.createElement('div');
            div.className = 'num';
            div.id = 'num-' + i;
            div.innerText = i;
            grid.appendChild(div);
        }

        btnSortear.addEventListener('click', () => {
            if(sorteando || sorteados.length >= 99) return;
            sorteando = true;
            btnSortear.disabled = true;

            let contagem = 0;
            let interval = setInterval(() => {
                btnSortear.innerText = Math.floor(Math.random() * 99) + 1;
                if(++contagem > 10) { clearInterval(interval); finalizarSorteio(); }
            }, 150);
        });

        function finalizarSorteio() {
            let novoNum;
            do { novoNum = Math.floor(Math.random() * 99) + 1; } while (sorteados.includes(novoNum));
            sorteados.push(novoNum);
            btnSortear.innerText = novoNum;
            document.getElementById('num-' + novoNum).classList.add('sorteado');
            
            let msg = new SpeechSynthesisUtterance(novoNum.toString());
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);

            setTimeout(() => { sorteando = false; btnSortear.disabled = false; }, 2000);
        }

        document.getElementById('btn-reset').addEventListener('click', () => {
            if(confirm("Deseja mesmo zerar o bingo?")) {
                sorteados = [];
                btnSortear.innerText = "?";
                document.querySelectorAll('.num').forEach(el => el.classList.remove('sorteado'));
            }
        });
    </script>
</body>
</html>
