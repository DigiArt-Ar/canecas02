<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo</title>
    <style>
        body { margin: 0; background: #2c3e50; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: sans-serif; }
        .container { display: flex; width: 95vw; height: 90vh; gap: 40px; align-items: center; }
        
        .left-col { width: 30%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        #btn-sortear { width: 25vh; height: 25vh; border-radius: 50%; border: 8px solid #f1c40f; background: #e67e22; color: white; font-size: 8vh; font-weight: bold; cursor: pointer; }
        #btn-reset { padding: 15px 30px; background: #c0392b; border: none; color: white; border-radius: 10px; cursor: pointer; font-size: 2vh; }
        
        .right-col { width: 70%; display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
        .num { background: #34495e; border-radius: 50%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 1.5vh; }
        .sorteado { background: #2ecc71; color: white; font-weight: bold; transform: scale(1.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="left-col">
        <button id="btn-sortear">SORTEAR</button>
        <button id="btn-reset">REINICIAR</button>
    </div>
    <div class="right-col" id="grid"></div>
</div>

<script>
    const btn = document.getElementById('btn-sortear');
    const grid = document.getElementById('grid');
    let sorteados = [];
    let travado = false;

    // Criar a grade (visual sem zero)
    for(let i=1; i<=99; i++) {
        let d = document.createElement('div');
        d.className = 'num'; d.id = 'n'+i; d.innerText = i;
        grid.appendChild(d);
    }

    // Seleção de voz mais natural disponível no aparelho
    function getVoz() {
        let vozes = window.speechSynthesis.getVoices();
        // Tenta encontrar uma voz PT-BR de melhor qualidade (geralmente do Google)
        return vozes.find(v => v.lang === 'pt-BR' && v.name.includes('Google')) || 
               vozes.find(v => v.lang === 'pt-BR');
    }

    btn.onclick = () => {
        if(travado || sorteados.length >= 99) return;
        travado = true;
        
        let cont = 0;
        let anim = setInterval(() => {
            btn.innerText = Math.floor(Math.random() * 99) + 1;
            if(++cont > 10) {
                clearInterval(anim);
                sortearFinal();
            }
        }, 150);
    };

    function sortearFinal() {
        let num = Math.floor(Math.random() * 99) + 1;
        while(sorteados.includes(num)) num = Math.floor(Math.random() * 99) + 1;
        
        sorteados.push(num);
        btn.innerText = num;
        document.getElementById('n'+num).classList.add('sorteado');
        
        // Fala direta sem "número", sem zeros
        let msg = new SpeechSynthesisUtterance(num.toString());
        msg.lang = 'pt-BR';
        msg.voice = getVoz();
        window.speechSynthesis.speak(msg);

        setTimeout(() => travado = false, 3000);
    }

    document.getElementById('btn-reset').onclick = () => {
        if(confirm("Tem certeza que deseja reiniciar?")) location.reload();
    };
</script>
</body>
</html>
