<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo em Família</title>
    <style>
        body { 
            margin: 0; background: #2c3e50; color: white; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .container { display: flex; width: 100vw; height: 100vh; align-items: center; justify-content: space-around; padding: 20px; }
        
        .col-left { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 30%; }
        #btn-sortear { 
            width: 25vh; height: 25vh; border-radius: 50%; border: 8px solid #f1c40f; 
            background: #e67e22; color: white; font-size: 8vh; font-weight: bold; cursor: pointer;
        }
        #btn-sortear:disabled { opacity: 0.6; cursor: wait; }
        
        .col-right { width: 65%; }
        #grid-numeros { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
        .num { background: #34495e; border-radius: 50%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 1.5vh; }
        .sorteado { background: #2ecc71; transform: scale(1.1); font-weight: bold; }
        #btn-reset { padding: 10px 20px; background: #c0392b; border: none; color: white; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="col-left">
            <button id="btn-sortear">SORTEAR</button>
            <button id="btn-reset">REINICIAR</button>
        </div>
        <div class="col-right">
            <div id="grid-numeros"></div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('btn-sortear');
        const grid = document.getElementById('grid-numeros');
        let sorteados = [];
        let bloqueado = false;

        // Função para formatar com zero à esquerda visualmente
        const formatar = (n) => n.toString().padStart(2, '0');

        for(let i=1; i<=99; i++) {
            let d = document.createElement('div');
            d.className = 'num'; d.id = 'n'+i; d.innerText = formatar(i);
            grid.appendChild(d);
        }

        btn.addEventListener('click', () => {
            if(bloqueado || sorteados.length >= 99) return;
            bloqueado = true;
            btn.disabled = true;

            let contagem = 0;
            let roleta = setInterval(() => {
                btn.innerText = formatar(Math.floor(Math.random() * 99) + 1);
                contagem++;
                if(contagem >= 10) {
                    clearInterval(roleta);
                    sortearFinal();
                }
            }, 200);
        });

        function sortearFinal() {
            let num = Math.floor(Math.random() * 99) + 1;
            while(sorteados.includes(num)) num = Math.floor(Math.random() * 99) + 1;
            
            sorteados.push(num);
            let valFormatado = formatar(num);
            btn.innerText = valFormatado;
            document.getElementById('n'+num).classList.add('sorteado');
            
            // Fala direta: apenas o número formatado, sem a palavra "número"
            // Ex: "0 1" ou "4 9"
            let fala = valFormatado.split('').join(' ');
            let msg = new SpeechSynthesisUtterance(fala);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);

            setTimeout(() => {
                bloqueado = false;
                btn.disabled = false;
            }, 3000);
        }

        document.getElementById('btn-reset').onclick = () => {
            if(confirm("Reiniciar sorteio?")) location.reload();
        };
    </script>
</body>
</html>
