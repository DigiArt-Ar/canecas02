<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiArt AR - Painel do Operador</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. TELA DE CONFIGURAÇÃO INICIAL */
    #setupScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      z-index: 200;
    }

    .setup-card {
      background-color: #141414;
      border: 2px solid #00FF00;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
    }

    .setup-card h1 {
      color: #00FF00;
      font-size: 1.8rem;
      margin-bottom: 5px;
      text-align: center;
    }

    .setup-card p {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #00FF00;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #1c1c1c;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #00FF00;
    }

    .btn-start {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: #00FF00;
      color: #000;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-start:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    /* 2. PAINEL DO OPERADOR AO VIVO */
    #dashboardContainer {
      width: 100%;
      height: 100vh;
      display: none;
      flex-direction: column;
    }

    header {
      height: 75px;
      background-color: #121212;
      border-bottom: 2px solid #00FF00;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      gap: 15px;
      flex-shrink: 0;
    }

    .logo-area h1 {
      color: #00FF00;
      font-size: 1.4rem;
    }

    .logo-area span {
      font-size: 0.85rem;
      color: #888;
    }

    .event-info-box {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 6px 16px;
      border-radius: 8px;
      text-align: left;
    }

    .event-info-box span {
      display: block;
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
    }

    .event-info-box strong {
      color: #00FF00;
      font-size: 0.95rem;
    }

    .timer-box {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 6px 18px;
      border-radius: 8px;
      text-align: center;
    }

    .timer-box span {
      display: block;
      font-size: 0.7rem;
      color: #aaa;
      text-transform: uppercase;
    }

    .timer-box h2 {
      color: #00FF00;
      font-size: 1.3rem;
      font-family: monospace;
    }

    .stats-box {
      display: flex;
      gap: 15px;
    }

    .stat-card {
      background-color: #1a1a1a;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      text-align: center;
    }

    .stat-card span {
      font-size: 0.7rem;
      color: #888;
    }

    .stat-card h3 {
      font-size: 1.1rem;
      color: #00FF00;
    }

    .btn-finish {
      background-color: #2a0a0a;
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-finish:hover {
      background-color: #ff4d4d;
      color: #000000;
    }

    .main-content {
      flex: 1;
      display: flex;
      padding: 15px;
      gap: 15px;
      overflow: hidden;
    }

    .left-column {
      flex: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .highlight-section {
      flex: 1;
      background-color: #141414;
      border: 2px solid #222;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      position: relative;
      height: 100%;
      min-height: 0;
    }

    .highlight-section h2 {
      align-self: flex-start;
      font-size: 0.9rem;
      color: #00FF00;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .highlight-viewer {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }

    .highlight-viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }

    .action-bar {
      display: flex;
      gap: 15px;
      width: 100%;
      margin-top: 12px;
      flex-shrink: 0;
    }

    .btn-action-print {
      flex: 2;
      background-color: #00FF00;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action-delete {
      flex: 1;
      background-color: #331010;
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action-print:disabled, .btn-action-delete:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .right-column {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-height: 0;
    }

    .qrcode-box {
      background-color: #141414;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
    }

    .qrcode-box p {
      font-size: 0.85rem;
      color: #aaa;
      max-width: 120px;
    }

    #qrcodeCanvas {
      background-color: #fff;
      padding: 5px;
      border-radius: 6px;
    }

    /* CAIXA DE CONFIGURAÇÃO DE PAPEL NO PAINEL */
    .paper-config-box {
      background-color: #141414;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .paper-config-box label {
      font-size: 0.8rem;
      color: #00FF00;
      font-weight: bold;
    }

    .paper-config-box select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #1c1c1c;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .paper-config-box select:focus {
      border-color: #00FF00;
    }

    .queue-section {
      flex: 1;
      background-color: #141414;
      border: 2px solid #222;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      padding: 15px;
      min-height: 0;
    }

    .queue-header {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .queue-header h2 {
      font-size: 1rem;
      color: #fff;
    }

    .queue-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .queue-item {
      background-color: #1c1c1c;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .queue-item:hover, .queue-item.selected {
      border-color: #00FF00;
      background-color: #242424;
    }

    .queue-thumb {
      width: 50px;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #000;
    }

    .queue-info {
      flex: 1;
    }

    .queue-info p {
      font-size: 0.85rem;
      color: #fff;
      font-weight: bold;
    }

    .queue-info span {
      font-size: 0.75rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- 1. TELA DE CONFIGURAÇÃO INICIAL -->
  <div id="setupScreen">
    <div class="setup-card">
      <h1>DigiArt AR</h1>
      <p>Configuração do Evento</p>

      <div class="form-group">
        <label for="inputEventId">ID do Evento (Sem espaços):</label>
        <input type="text" id="inputEventId" placeholder="Ex: maria15" value="festa-teste">
      </div>

      <div class="form-group">
        <label for="inputEventHours">Duração do Evento (Horas):</label>
        <input type="number" id="inputEventHours" value="4" min="1" max="12">
      </div>

      <!-- SELEÇÃO DE TAMANHO DE PAPEL ADICIONADA NA TELA INICIAL -->
      <div class="form-group">
        <label for="setupSelectPaperSize">📄 Tamanho do Papel da Impressora:</label>
        <select id="setupSelectPaperSize">
          <option value="100mm 150mm">10 x 15 cm (Padrão)</option>
          <option value="150mm 210mm">15 x 21 cm</option>
          <option value="75mm 100mm">7.5 x 10 cm</option>
        </select>
      </div>

      <div class="form-group">
        <label for="inputFrameFile">Moldura do Evento (Imagem PNG):</label>
        <input type="file" id="inputFrameFile" accept="image/png">
      </div>

      <button class="btn-start" id="btnStartEvent">INICIAR EVENTO</button>
    </div>
  </div>

  <!-- 2. PAINEL DO OPERADOR AO VIVO -->
  <div id="dashboardContainer">
    <header>
      <div class="logo-area">
        <h1>DigiArt AR</h1>
        <span>Estação de Fotos</span>
      </div>

      <div class="event-info-box">
        <span>Evento Ativo</span>
        <strong id="infoEventId">---</strong>
        <span id="infoEventDate" style="font-size: 0.65rem; color: #aaa; margin-top: 2px;">Início: --/-- --:--</span>
      </div>

      <div class="timer-box">
        <span>Tempo Restante</span>
        <h2 id="countdownTimer">00:00:00</h2>
      </div>

      <div class="stats-box">
        <div class="stat-card">
          <span>Na Fila</span>
          <h3 id="countQueue">0</h3>
        </div>
        <div class="stat-card">
          <span>Impressas</span>
          <h3 id="countPrinted">0</h3>
        </div>
      </div>

      <button class="btn-finish" id="btnFinishEvent">FINALIZAR EVENTO</button>
    </header>

    <div class="main-content">
      <div class="left-column">
        <section class="highlight-section">
          <h2>📸 Visualizador de Foto Selecionada</h2>
          
          <div class="highlight-viewer" id="highlightViewer">
            <p style="color:#555;">Aguardando fotos dos convidados...</p>
          </div>

          <div class="action-bar">
            <button class="btn-action-print" id="btnActionPrint" disabled>🖨️ IMPRIMIR FOTO</button>
            <button class="btn-action-delete" id="btnActionDelete" disabled>🗑️ EXCLUIR</button>
          </div>
        </section>
      </div>

      <div class="right-column">
        <div class="qrcode-box">
          <p><strong>Escaneie para tirar foto:</strong></p>
          <div id="qrcodeCanvas"></div>
        </div>

        <!-- PAINEL DE SELEÇÃO DE TAMANHO DE PAPEL NO PAINEL -->
        <div class="paper-config-box">
          <label for="selectPaperSize">📄 Papel da Impressora:</label>
          <select id="selectPaperSize">
            <option value="100mm 150mm">10 x 15 cm (Padrão)</option>
            <option value="150mm 210mm">15 x 21 cm</option>
            <option value="75mm 100mm">7.5 x 10 cm</option>
          </select>
        </div>

        <section class="queue-section">
          <div class="queue-header">
            <h2>Fila de Impressão (Ordem de Chegada)</h2>
          </div>
          <div class="queue-list" id="queueList"></div>
        </section>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, updateDoc, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9cempkBujGI2cOzpNLmMWzYEp1nrOogI",
      authDomain: "estacao-de-fotos.firebaseapp.com",
      projectId: "estacao-de-fotos",
      storageBucket: "estacao-de-fotos.firebasestorage.app",
      messagingSenderId: "227871054513",
      appId: "1:227871054513:web:8588dfa40f8a9da6166090",
      measurementId: "G-3CTFM7HHZQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ELEMENTOS
    const setupScreen = document.getElementById("setupScreen");
    const dashboardContainer = document.getElementById("dashboardContainer");

    const inputEventId = document.getElementById("inputEventId");
    const inputEventHours = document.getElementById("inputEventHours");
    const setupSelectPaperSize = document.getElementById("setupSelectPaperSize");
    const inputFrameFile = document.getElementById("inputFrameFile");
    const btnStartEvent = document.getElementById("btnStartEvent");
    const btnFinishEvent = document.getElementById("btnFinishEvent");

    const infoEventId = document.getElementById("infoEventId");
    const infoEventDate = document.getElementById("infoEventDate");
    const countdownTimer = document.getElementById("countdownTimer");
    const highlightViewer = document.getElementById("highlightViewer");
    const queueList = document.getElementById("queueList");
    const countQueue = document.getElementById("countQueue");
    const countPrinted = document.getElementById("countPrinted");

    const btnActionPrint = document.getElementById("btnActionPrint");
    const btnActionDelete = document.getElementById("btnActionDelete");
    const selectPaperSize = document.getElementById("selectPaperSize");

    let currentEventId = "";
    let totalImpressas = 0;
    let timerInterval = null;
    let unsubscribeSnapshot = null;
    let fotoSelecionadaAtual = null;

    // RESTAURAR PAPEL SELECIONADO ANTERIORMENTE E SINCRONIZAR OS SELECTS
    const papelSalvo = localStorage.getItem("digiart_papel_selecionado");
    if (papelSalvo) {
      setupSelectPaperSize.value = papelSalvo;
      selectPaperSize.value = papelSalvo;
    }

    // SINCRONIZAÇÃO ENTRE OS DOS SELECTS (TELA INICIAL E PAINEL)
    setupSelectPaperSize.addEventListener("change", (e) => {
      const val = e.target.value;
      selectPaperSize.value = val;
      localStorage.setItem("digiart_papel_selecionado", val);
    });

    selectPaperSize.addEventListener("change", (e) => {
      const val = e.target.value;
      setupSelectPaperSize.value = val;
      localStorage.setItem("digiart_papel_selecionado", val);
    });

    // COMPRESSOR DE MOLDURA EM CANVAS
    function comprimirMolduraPNG(file, maxDimension = 1200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL("image/png");
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // AVISO ANTES DE ATUALIZAR A PÁGINA
    window.addEventListener("beforeunload", (e) => {
      if (currentEventId) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    async function restaurarSessaoAtiva() {
      const eventoSalvo = localStorage.getItem("digiart_evento_ativo");
      const tempoFimSalvo = localStorage.getItem("digiart_tempo_fim");
      const dataInicioSalva = localStorage.getItem("digiart_data_inicio");

      if (eventoSalvo) {
        currentEventId = eventoSalvo;
        
        setupScreen.style.display = "none";
        dashboardContainer.style.display = "flex";

        infoEventId.innerText = currentEventId;
        if (dataInicioSalva) {
          const dt = new Date(dataInicioSalva);
          infoEventDate.innerText = `Início: ${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`;
        }

        gerarQRCodeCliente(currentEventId);
        monitorarFotos();

        if (tempoFimSalvo) {
          const restanteSegundos = Math.max(0, Math.floor((parseInt(tempoFimSalvo) - Date.now()) / 1000));
          iniciarCronometroComSegundos(restanteSegundos);
        }
      }
    }

    // INICIAR EVENTO
    btnStartEvent.addEventListener("click", async () => {
      const eventIdRaw = inputEventId.value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!eventIdRaw) {
        alert("Por favor, informe o ID do evento!");
        return;
      }

      currentEventId = eventIdRaw;
      btnStartEvent.innerText = "OTIMIZANDO MOLDURA...";
      btnStartEvent.disabled = true;

      let molduraBase64 = "";

      try {
        if (inputFrameFile.files.length > 0) {
          molduraBase64 = await comprimirMolduraPNG(inputFrameFile.files[0], 1200);
        }

        btnStartEvent.innerText = "SALVANDO EVENTO...";

        const agora = new Date();
        const horas = parseInt(inputEventHours.value) || 4;
        const tempoFimTimestamp = Date.now() + (horas * 3600 * 1000);

        // Salva papel configurado
        localStorage.setItem("digiart_papel_selecionado", setupSelectPaperSize.value);

        await setDoc(doc(db, "eventos", currentEventId), {
          nome: currentEventId,
          molduraUrl: molduraBase64,
          criadoEm: agora
        }, { merge: true });

        localStorage.setItem("digiart_evento_ativo", currentEventId);
        localStorage.setItem("digiart_tempo_fim", tempoFimTimestamp);
        localStorage.setItem("digiart_data_inicio", agora.toISOString());

        setupScreen.style.display = "none";
        dashboardContainer.style.display = "flex";

        infoEventId.innerText = currentEventId;
        infoEventDate.innerText = `Início: ${agora.toLocaleDateString('pt-BR')} ${agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`;

        gerarQRCodeCliente(currentEventId);
        iniciarCronometroComSegundos(horas * 3600);
        monitorarFotos();

      } catch (erro) {
        console.error("Erro ao iniciar evento:", erro);
        alert("Erro ao processar imagem ou salvar no banco de dados!");
        btnStartEvent.innerText = "INICIAR EVENTO";
        btnStartEvent.disabled = false;
      }
    });

    // FINALIZAR EVENTO
    btnFinishEvent.addEventListener("click", () => {
      const confirma = confirm(`Tem certeza que deseja FINALIZAR o evento "${currentEventId}"?`);
      if (confirma) {
        localStorage.removeItem("digiart_evento_ativo");
        localStorage.removeItem("digiart_tempo_fim");
        localStorage.removeItem("digiart_data_inicio");

        if (timerInterval) clearInterval(timerInterval);
        if (unsubscribeSnapshot) unsubscribeSnapshot();

        currentEventId = "";
        totalImpressas = 0;
        fotoSelecionadaAtual = null;
        limparDestaque();

        dashboardContainer.style.display = "none";
        setupScreen.style.display = "flex";
        btnStartEvent.innerText = "INICIAR EVENTO";
        btnStartEvent.disabled = false;
      }
    });

    function gerarQRCodeCliente(eventId) {
      const urlBase = window.location.href.split('/painel')[0];
      const linkCamera = `${urlBase}/camera/?evento=${eventId}`;

      document.getElementById("qrcodeCanvas").innerHTML = "";
      new QRCode(document.getElementById("qrcodeCanvas"), {
        text: linkCamera,
        width: 100,
        height: 100
      });
    }

    // MONITORAR FILA (ORDEM DE CHEGADA: ASC)
    function monitorarFotos() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const fotosRef = collection(db, "eventos", currentEventId, "fotos");
      const q = query(fotosRef, orderBy("criadoEm", "asc"));

      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        queueList.innerHTML = "";
        let contadorPendentes = 0;
        let pendentesArray = [];

        snapshot.forEach((docSnap) => {
          const foto = docSnap.data();
          foto.id = docSnap.id;

          if (foto.status === "pendente") {
            contadorPendentes++;
            pendentesArray.push(foto);
          }
        });

        countQueue.innerText = contadorPendentes;

        // Renderiza itens da fila
        pendentesArray.forEach((foto, idx) => {
          const item = document.createElement("div");
          item.className = `queue-item ${fotoSelecionadaAtual && fotoSelecionadaAtual.id === foto.id ? 'selected' : ''}`;
          item.innerHTML = `
            <img src="${foto.fotoUrl}" class="queue-thumb" alt="Miniatura">
            <div class="queue-info">
              <p>Foto #${idx + 1}</p>
              <span>Aguardando impressão</span>
            </div>
          `;

          item.addEventListener("click", () => {
            selecionarFotoParaDestaque(foto);
          });

          queueList.appendChild(item);
        });

        // Se houver fotos e nenhuma estiver selecionada, seleciona a PRIMEIRA da fila
        if (pendentesArray.length > 0) {
          if (!fotoSelecionadaAtual || !pendentesArray.some(f => f.id === fotoSelecionadaAtual.id)) {
            selecionarFotoParaDestaque(pendentesArray[0]);
          }
        } else {
          limparDestaque();
        }
      });
    }

    function selecionarFotoParaDestaque(foto) {
      fotoSelecionadaAtual = foto;
      highlightViewer.innerHTML = `<img src="${foto.fotoUrl}" alt="Foto Destaque">`;
      btnActionPrint.disabled = false;
      btnActionDelete.disabled = false;

      document.querySelectorAll(".queue-item").forEach(el => el.classList.remove("selected"));
    }

    function limparDestaque() {
      fotoSelecionadaAtual = null;
      highlightViewer.innerHTML = `<p style="color:#555;">Aguardando fotos dos convidados...</p>`;
      btnActionPrint.disabled = true;
      btnActionDelete.disabled = true;
    }

    // BOTAO IMPRIMIR FOTO DA TELA PRINCIPAL
    btnActionPrint.addEventListener("click", async () => {
      if (!fotoSelecionadaAtual) return;

      btnActionPrint.disabled = true;
      const { id, fotoUrl } = fotoSelecionadaAtual;
      await executarImpressao(id, fotoUrl);
    });

    // BOTAO EXCLUIR FOTO DA TELA PRINCIPAL
    btnActionDelete.addEventListener("click", async () => {
      if (!fotoSelecionadaAtual) return;

      const confirma = confirm("Deseja realmente excluir esta foto da fila?");
      if (confirma) {
        const fotoRef = doc(db, "eventos", currentEventId, "fotos", fotoSelecionadaAtual.id);
        await deleteDoc(fotoRef);
        fotoSelecionadaAtual = null;
      }
    });

    // IMPRESSÃO DINÂMICA DE ACORDO COM O PAPEL SELECIONADO
    async function executarImpressao(id, url) {
      const dimensaoPapel = selectPaperSize.value;

      const iframeAntigo = document.getElementById("printFrame");
      if (iframeAntigo) {
        iframeAntigo.remove();
      }

      const iframe = document.createElement("iframe");
      iframe.id = "printFrame";
      iframe.style.position = "fixed";
      iframe.style.right = "0";
      iframe.style.bottom = "0";
      iframe.style.width = "0";
      iframe.style.height = "0";
      iframe.style.border = "none";
      document.body.appendChild(iframe);

      const docIframe = iframe.contentWindow.document;
      docIframe.open();
      
      docIframe.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <style>
              @page {
                size: ${dimensaoPapel} portrait !important;
                margin: 0 !important;
              }
              *, html, body {
                margin: 0 !important;
                padding: 0 !important;
                box-sizing: border-box !important;
              }
              html, body {
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
                background-color: #ffffff;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
              }
              img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
                object-position: center !important;
                display: block !important;
              }
            </style>
          </head>
          <body>
            <img src="${url}" onload="window.focus(); window.print();" />
          </body>
        </html>
      `);
      docIframe.close();

      const fotoRef = doc(db, "eventos", currentEventId, "fotos", id);
      await updateDoc(fotoRef, { status: "impressa" });

      totalImpressas++;
      countPrinted.innerText = totalImpressas;
      
      fotoSelecionadaAtual = null;
    }

    function iniciarCronometroComSegundos(segundosTotais) {
      if (timerInterval) clearInterval(timerInterval);
      let tempoRestante = segundosTotais;

      const atualizarTela = () => {
        if (tempoRestante > 0) {
          tempoRestante--;
          let h = Math.floor(tempoRestante / 3600);
          let m = Math.floor((tempoRestante % 3600) / 60);
          let s = tempoRestante % 60;
          countdownTimer.innerText = 
            String(h).padStart(2, '0') + ":" + 
            String(m).padStart(2, '0') + ":" + 
            String(s).padStart(2, '0');
        } else {
          countdownTimer.innerText = "00:00:00";
        }
      };

      atualizarTela();
      timerInterval = setInterval(atualizarTela, 1000);
    }

    window.addEventListener("DOMContentLoaded", () => {
      restaurarSessaoAtiva();
    });
  </script>
</body>
</html>
