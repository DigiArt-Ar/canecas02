<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>DigiArt AR - Câmera do Evento</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* SOBREPOSIÇÃO DO TUTORIAL */
    .tutorial-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      padding: 20px;
    }

    .tutorial-box {
      text-align: center;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .hand-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: clickAnimation 1.2s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes clickAnimation {
      0% { transform: scale(1) translateY(0); opacity: 0.8; }
      50% { transform: scale(0.85) translateY(12px); opacity: 1; filter: drop-shadow(0 0 15px #00FF00); }
      100% { transform: scale(1) translateY(0); opacity: 0.8; }
    }

    .tutorial-box h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #00FF00;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .tutorial-box p {
      font-size: 0.95rem;
      color: #CCCCCC;
      font-weight: 400;
    }

    /* MENSAGEM FLUÍDA DE SUCESSO (TOAST) */
    .toast-message {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      background-color: #00FF00;
      color: #000000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(0, 255, 0, 0.4);
      z-index: 100;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-message.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .camera-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: #000000;
      position: relative;
      overflow: hidden;
    }

    /* O container da câmera fica colado no topo absoluto */
    .viewport-box {
      position: relative;
      width: 100%;
      flex: 1;
      background-color: #000000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #videoFeed, #photoPreview {
      width: 100%;
      height: 100%;
      object-fit: contain; 
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top center;
      background-color: #000000;
      z-index: 1;
    }

    /* Moldura PNG alinhada no topo */
    #frameOverlay {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
      background-color: transparent;
    }

    /* BARRA INFERIOR */
    .controls-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #000000;
      z-index: 30;
      flex-shrink: 0;
      padding: 10px 25px max(15px, env(safe-area-inset-bottom)) 25px;
    }

    .controls-top-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .brand-logo {
      color: #00FF00;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-circle-action {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: transparent;
      border: 2px solid #00FF00;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 255, 0, 0.4);
      outline: none;
    }

    .btn-circle-action svg {
      width: 24px;
      height: 24px;
      fill: #00FF00;
    }

    .controls-bottom-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 5px;
    }

    .btn-capture {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: transparent;
      border: 5px solid #00FF00;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
      transition: transform 0.1s ease;
    }

    .btn-capture:active {
      transform: scale(0.92);
    }

    .inner-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #FFFFFF;
    }

    .controls-review {
      width: 100%;
      padding: 15px 20px max(20px, env(safe-area-inset-bottom)) 20px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background-color: #000000;
      z-index: 30;
      flex-shrink: 0;
    }

    .btn-action {
      flex: 1;
      max-width: 140px;
      padding: 14px;
      border-radius: 25px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-retake {
      background-color: #333333;
      color: #FFFFFF;
      border: 1px solid #555;
    }

    .btn-send {
      background-color: #00FF00;
      color: #000000;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="tutorial-overlay" id="tutorialOverlay">
    <div class="tutorial-box">
      <div class="hand-icon">👆</div>
      <h2>TOQUE NA TELA</h2>
      <p>Para abrir a câmera em Tela Cheia</p>
    </div>
  </div>

  <main class="camera-container" id="mainContainer">

    <div class="toast-message" id="toastMessage">✨ Foto enviada com sucesso!</div>

    <div class="viewport-box" id="viewportBox">
      <video id="videoFeed" autoplay playsinline muted></video>
      <canvas id="photoCanvas" style="display: none;"></canvas>
      <img id="frameOverlay" src="" alt="Moldura do Evento" style="display: none;">
      <img id="photoPreview" src="" alt="Sua Foto" style="display: none; z-index: 6;">
    </div>

    <div class="controls-bar" id="controlsCapture">
      <div class="controls-top-row">
        <div class="brand-logo">DigiArt Ar</div>

        <div class="top-actions">
          <button class="btn-circle-action" id="btnFlash" title="Flash Desativado" style="opacity: 0.5; pointer-events: none;">
            <svg viewBox="0 0 24 24">
              <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
            </svg>
          </button>

          <button class="btn-circle-action" id="btnFlip" title="Inverter Câmera">
            <svg viewBox="0 0 24 24">
              <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C9.01 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C14.99 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="controls-bottom-row">
        <button class="btn-capture" id="btnCapture" title="Tirar Foto">
          <div class="inner-circle"></div>
        </button>
      </div>
    </div>

    <div class="controls-review" id="controlsReview" style="display: none;">
      <button class="btn-action btn-retake" id="btnRetake">Refazer</button>
      <button class="btn-action btn-send" id="btnSend">Enviar Foto</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9cempkBujGI2cOzpNLmMWzYEp1nrOogI",
      authDomain: "estacao-de-fotos.firebaseapp.com",
      projectId: "estacao-de-fotos",
      storageBucket: "estacao-de-fotos.firebasestorage.app",
      messagingSenderId: "227871054513",
      appId: "1:227871054513:web:8588dfa40f8a9da6166090",
      measurementId: "G-3CTFM7HHZQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const videoFeed = document.getElementById("videoFeed");
    const photoCanvas = document.getElementById("photoCanvas");
    const frameOverlay = document.getElementById("frameOverlay");
    const photoPreview = document.getElementById("photoPreview");
    const toastMessage = document.getElementById("toastMessage");
    const viewportBox = document.getElementById("viewportBox");

    const btnCapture = document.getElementById("btnCapture");
    const btnFlip = document.getElementById("btnFlip");
    const btnRetake = document.getElementById("btnRetake");
    const btnSend = document.getElementById("btnSend");

    const controlsCapture = document.getElementById("controlsCapture");
    const controlsReview = document.getElementById("controlsReview");

    const tutorialOverlay = document.getElementById("tutorialOverlay");
    const mainContainer = document.getElementById("mainContainer");

    let currentStream = null;
    let facingMode = "environment"; 
    let capturedDataUrl = null;
    let capturedOriginalUrl = null;
    let currentEventId = null;
    let toastTimeout = null;
    
    let currentZoom = 1;
    let minZoom = 1;
    let maxZoom = 5;
    let initialPinchDistance = null;

    // Tratamento robusto para remover o tutorial e entrar em tela cheia sem travar
    function fecharTutorial(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      if (mainContainer.requestFullscreen) {
        mainContainer.requestFullscreen().catch(() => {});
      } else if (mainContainer.webkitRequestFullscreen) {
        mainContainer.webkitRequestFullscreen().catch(() => {});
      }

      tutorialOverlay.style.display = "none";
      tutorialOverlay.remove();
    }

    tutorialOverlay.addEventListener("click", fecharTutorial, { once: true });
    tutorialOverlay.addEventListener("touchend", fecharTutorial, { once: true });

    function obterIdEventoUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("evento") || "festa-teste";
    }

    async function iniciarCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      currentZoom = 1;
      atualizarZoomVisual();

      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoFeed.srcObject = currentStream;

        const track = currentStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};

        if (capabilities.zoom) {
          minZoom = capabilities.zoom.min || 1;
          maxZoom = capabilities.zoom.max || 5;
          currentZoom = minZoom;
        }

      } catch (err) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          videoFeed.srcObject = currentStream;
        } catch (e) {
          alert("Permita o acesso à câmera no seu navegador.");
        }
      }
    }

    btnFlip.addEventListener("click", () => {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      iniciarCamera();
    });

    function atualizarZoomVisual() {
      videoFeed.style.transform = `scale(${currentZoom})`;
    }

    async function aplicarZoomHardware(novoZoom) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (capabilities.zoom) {
        novoZoom = Math.max(minZoom, Math.min(maxZoom, novoZoom));
        try {
          await track.applyConstraints({ advanced: [{ zoom: novoZoom }] });
          currentZoom = novoZoom;
          return;
        } catch (e) {}
      }

      currentZoom = Math.max(1, Math.min(4, novoZoom));
      atualizarZoomVisual();
    }

    viewportBox.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    viewportBox.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );

        const diff = currentDistance - initialPinchDistance;
        const zoomDelta = diff * 0.005;
        
        aplicarZoomHardware(currentZoom + zoomDelta);
        initialPinchDistance = currentDistance;
      }
    }, { passive: true });

    viewportBox.addEventListener("touchend", () => {
      initialPinchDistance = null;
    });

    async function carregarMolduraEvento() {
      currentEventId = obterIdEventoUrl();
      try {
        const eventRef = doc(db, "eventos", currentEventId);
        const eventSnap = await getDoc(eventRef);

        if (eventSnap.exists() && eventSnap.data().molduraUrl) {
          frameOverlay.src = eventSnap.data().molduraUrl;
          frameOverlay.style.display = "block";
          
          frameOverlay.onload = () => {
            const aspect = frameOverlay.naturalWidth / frameOverlay.naturalHeight;
            viewportBox.style.aspectRatio = aspect;
          };
        }
      } catch (err) {
        console.log("Sem moldura personalizada encontrada.");
      }
    }

    btnCapture.addEventListener("click", () => {
      const width = frameOverlay.naturalWidth || videoFeed.videoWidth || 1080;
      const height = frameOverlay.naturalHeight || videoFeed.videoHeight || 1920;

      photoCanvas.width = width;
      photoCanvas.height = height;

      const ctx = photoCanvas.getContext("2d");
      
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      if (facingMode === "user") {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }

      const vWidth = videoFeed.videoWidth || width;
      const vHeight = videoFeed.videoHeight || height;
      
      const hRatio = width / vWidth;
      const vRatio = height / vHeight;
      const ratio = Math.min(hRatio, vRatio) * currentZoom;
      
      const centerShiftX = (width - vWidth * ratio) / 2;
      const centerShiftY = (height - vHeight * ratio) / 2;

      ctx.drawImage(videoFeed, 0, 0, vWidth, vHeight, centerShiftX, centerShiftY, vWidth * ratio, vHeight * ratio);

      ctx.setTransform(1, 0, 0, 1, 0, 0);

      capturedOriginalUrl = photoCanvas.toDataURL("image/jpeg", 0.85);

      if (frameOverlay.src && frameOverlay.style.display !== "none") {
        ctx.drawImage(frameOverlay, 0, 0, width, height);
      }

      capturedDataUrl = photoCanvas.toDataURL("image/jpeg", 0.85);
      photoPreview.src = capturedDataUrl;
      photoPreview.style.display = "block";
      videoFeed.style.display = "none";

      controlsCapture.style.display = "none";
      controlsReview.style.display = "flex";
    });

    btnRetake.addEventListener("click", () => {
      capturedDataUrl = null;
      capturedOriginalUrl = null;
      photoPreview.style.display = "none";
      videoFeed.style.display = "block";

      controlsCapture.style.display = "flex";
      controlsReview.style.display = "none";
    });

    function mostrarAvisoSucesso() {
      clearTimeout(toastTimeout);
      toastMessage.classList.add("show");
      toastTimeout = setTimeout(() => {
        toastMessage.classList.remove("show");
      }, 2500);
    }

    btnSend.addEventListener("click", () => {
      if (!capturedDataUrl) return;

      const fotoParaEnviar = capturedDataUrl;
      const fotoOriginalParaEnviar = capturedOriginalUrl;

      photoPreview.style.display = "none";
      videoFeed.style.display = "block";
      controlsCapture.style.display = "flex";
      controlsReview.style.display = "none";
      capturedDataUrl = null;
      capturedOriginalUrl = null;

      mostrarAvisoSucesso();

      addDoc(collection(db, "eventos", currentEventId, "fotos"), {
        fotoUrl: fotoParaEnviar,
        fotoOriginalUrl: fotoOriginalParaEnviar,
        status: "pendente",
        criadoEm: serverTimestamp()
      }).catch(err => {
        console.error("Erro ao enviar foto em segundo plano:", err);
      });
    });

    window.addEventListener("DOMContentLoaded", () => {
      iniciarCamera();
      carregarMolduraEvento();
    });
  </script>
</body>
</html>
