<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      /* Previne seleção de texto e zoom por toque */
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* Fix para navegadores móveis */
      height: -webkit-fill-available;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      /* Garante que o corpo ocupe toda a área visível */
      overscroll-behavior: none; 
    }

    /* SOBREPOSIÇÃO DO TUTORIAL */
    .tutorial-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      cursor: pointer;
      padding: 20px;
    }

    .tutorial-box {
      text-align: center;
      color: #FFFFFF;
      pointer-events: none;
    }

    .hand-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: clickAnimation 1.2s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes clickAnimation {
      0% { transform: scale(1) translateY(0); opacity: 0.8; }
      50% { transform: scale(0.85) translateY(12px); opacity: 1; filter: drop-shadow(0 0 15px #00FF00); }
      100% { transform: scale(1) translateY(0); opacity: 0.8; }
    }

    .tutorial-box h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #00FF00;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .tutorial-box p {
      font-size: 1.1rem;
      color: #CCCCCC;
    }

    /* MENSAGEM FLUÍDA DE SUCESSO (TOAST) */
    .toast-message {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      background-color: #00FF00;
      color: #000000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(0, 255, 0, 0.4);
      z-index: 100;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-message.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .camera-container {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #000;
    }

    /* Área Principal da Câmera */
    .viewport-box {
      position: relative;
      width: 100%;
      flex: 1;
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoFeed, #photoPreview, #frameOverlay {
      width: 100%;
      height: 100%;
      /* ESTA É A MUDANÇA CRÍTICA: Garante que a mídia seja contida proporcionalmente 
         sem cortar o conteúdo importante, criando barras pretas se necessário */
      object-fit: contain;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      backface-visibility: hidden;
    }

    #videoFeed {
      will-change: transform;
      z-index: 1;
    }

    #frameOverlay {
      pointer-events: none;
      z-index: 10; /* Moldura fica sobre o vídeo */
    }

    /* BARRA INFERIOR */
    .controls-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #000000;
      z-index: 30;
      flex-shrink: 0;
      /* Padding seguro para iPhones com notch */
      padding: 15px 25px max(15px, env(safe-area-inset-bottom)) 25px;
    }

    .controls-top-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand-logo {
      color: #00FF00;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      white-space: nowrap;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
    }

    .btn-flip {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: transparent;
      border: 2px solid #00FF00;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 255, 0, 0.4);
      transition: background-color 0.2s;
    }

    .btn-flip:active {
      background-color: rgba(0, 255, 0, 0.1);
    }

    .btn-flip svg {
      width: 26px;
      height: 26px;
      fill: #00FF00;
    }

    .controls-bottom-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-capture {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: transparent;
      border: 5px solid #00FF00;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
      transition: transform 0.1s ease, box-shadow 0.2s;
    }

    .btn-capture:active {
      transform: scale(0.92);
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
    }

    .inner-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #FFFFFF;
      transition: background-color 0.2s;
    }
    .btn-capture:active .inner-circle {
      background-color: #e0e0e0;
    }

    /* Painel de Revisão (Refazer / Enviar) */
    .controls-review {
      width: 100%;
      padding: 20px 25px max(20px, env(safe-area-inset-bottom)) 25px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background-color: #000000;
      z-index: 30;
      flex-shrink: 0;
      gap: 20px;
    }

    .btn-action {
      flex: 1;
      max-width: 160px;
      padding: 16px;
      border-radius: 30px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-action:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-retake {
      background-color: #333333;
      color: #FFFFFF;
      border: 1px solid #555;
    }

    .btn-send {
      background-color: #00FF00;
      color: #000000;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
    }
  </style>
