<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>DigiArt AR - Câmera do Evento</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* SOBREPOSIÇÃO DO TUTORIAL DE TELA CHEIA */
    .tutorial-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 20px;
    }

    .tutorial-box {
      text-align: center;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hand-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: clickAnimation 1.2s infinite ease-in-out;
      display: inline-block;
    }

    /* Animação do dedo simulando o toque de clique */
    @keyframes clickAnimation {
      0% { transform: scale(1) translateY(0); opacity: 0.8; }
      50% { transform: scale(0.85) translateY(12px); opacity: 1; filter: drop-shadow(0 0 15px #00FF00); }
      100% { transform: scale(1) translateY(0); opacity: 0.8; }
    }

    .tutorial-box h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #00FF00;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .tutorial-box p {
      font-size: 0.95rem;
      color: #CCCCCC;
      font-weight: 400;
    }

    .camera-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #000;
    }

    /* Área Principal da Câmera preenchendo o espaço dinamicamente */
    .viewport-box {
      position: relative;
      width: 100%;
      flex: 1;
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoFeed, #photoPreview, #frameOverlay {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Mantém a proporção exata da moldura sem cortar as bordas */
      position: absolute;
      top: 0;
      left: 0;
    }

    #frameOverlay {
      pointer-events: none;
      z-index: 10;
    }

    /* BARRA INFERIOR INTEGRADA (Logo na Esquerda + Botão Foto no Centro + Inverter na Direita) */
    .controls-bar {
      width: 100%;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      background-color: #000000;
      z-index: 30;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Texto DigiArt Ar na esquerda */
    .brand-logo {
      color: #00FF00;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      white-space: nowrap;
      min-width: 90px;
    }

    /* Botão de Tirar Foto GRANDE no centro */
    .btn-capture {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: transparent;
      border: 5px solid #00FF00;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.6);
      transition: transform 0.1s ease;
    }

    .btn-capture:active {
      transform: scale(0.92);
    }

    .inner-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #FFFFFF;
    }

    /* Botão de Inverter Câmera na direita */
    .btn-flip {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: transparent;
      border: 2px solid #00FF00;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
    }

    .btn-flip svg {
      width: 24px;
      height: 24px;
      fill: #00FF00;
    }

    /* Painel de Revisão (Refazer / Enviar) */
    .controls-review {
      width: 100%;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 20px;
      background-color: #000000;
      z-index: 30;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .btn-action {
      flex: 1;
      max-width: 140px;
      padding: 14px;
      border-radius: 25px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-retake {
      background-color: #333333;
      color: #FFFFFF;
      border: 1px solid #555;
    }

    .btn-send {
      background-color: #00FF00;
      color: #000000;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
    }

    /* Modal de Status */
    .status-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .status-content {
      background-color: #1a1a1a;
      border: 2px solid #00FF00;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      color: #FFFFFF;
      max-width: 320px;
      width: 100%;
    }

    .status-content h3 {
      color: #00FF00;
      margin-bottom: 10px;
    }

    .status-content p {
      color: #CCCCCC;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #00FF00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-close {
      background-color: #00FF00;
      color: #000;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="tutorial-overlay" id="tutorialOverlay">
    <div class="tutorial-box">
      <div class="hand-icon">👆</div>
      <h2>TOQUE NA TELA</h2>
      <p>Para abrir a câmera em Tela Cheia</p>
    </div>
  </div>

  <main class="camera-container" id="mainContainer">

    <div class="viewport-box">
      <video id="videoFeed" autoplay playsinline muted></video>
      <canvas id="photoCanvas" style="display: none;"></canvas>
      <img id="frameOverlay" src="" alt="Moldura do Evento" style="display: none;">
      <img id="photoPreview" src="" alt="Sua Foto" style="display: none;">
    </div>

    <div class="controls-bar" id="controlsCapture">
      <div class="brand-logo">DigiArt Ar</div>

      <button class="btn-capture" id="btnCapture" title="Tirar Foto">
        <div class="inner-circle"></div>
      </button>

      <button class="btn-flip" id="btnFlip" title="Inverter Câmera">
        <svg viewBox="0 0 24 24">
          <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C9.01 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C14.99 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
        </svg>
      </button>
    </div>

    <div class="controls-review" id="controlsReview" style="display: none;">
      <button class="btn-action btn-retake" id="btnRetake">Refazer</button>
      <button class="btn-action btn-send" id="btnSend">Enviar Foto</button>
    </div>
  </main>

  <div class="status-modal" id="statusModal" style="display: none;">
    <div class="status-content">
      <div class="spinner" id="statusSpinner"></div>
      <h3 id="statusTitle">Enviando sua foto...</h3>
      <p id="statusMessage">Aguarde um momento enquanto enviamos para a fila de impressão.</p>
      <button class="btn-action btn-close" id="btnCloseModal" style="display: none;">Tirar Outra Foto</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9cempkBujGI2cOzpNLmMWzYEp1nrOogI",
      authDomain: "estacao-de-fotos.firebaseapp.com",
      projectId: "estacao-de-fotos",
      storageBucket: "estacao-de-fotos.firebasestorage.app",
      messagingSenderId: "227871054513",
      appId: "1:227871054513:web:8588dfa40f8a9da6166090",
      measurementId: "G-3CTFM7HHZQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const videoFeed = document.getElementById("videoFeed");
    const photoCanvas = document.getElementById("photoCanvas");
    const frameOverlay = document.getElementById("frameOverlay");
    const photoPreview = document.getElementById("photoPreview");

    const btnCapture = document.getElementById("btnCapture");
    const btnFlip = document.getElementById("btnFlip");
    const btnRetake = document.getElementById("btnRetake");
    const btnSend = document.getElementById("btnSend");

    const controlsCapture = document.getElementById("controlsCapture");
    const controlsReview = document.getElementById("controlsReview");

    const statusModal = document.getElementById("statusModal");
    const statusTitle = document.getElementById("statusTitle");
    const statusMessage = document.getElementById("statusMessage");
    const statusSpinner = document.getElementById("statusSpinner");
    const btnCloseModal = document.getElementById("btnCloseModal");

    const tutorialOverlay = document.getElementById("tutorialOverlay");

    let currentStream = null;
    let facingMode = "environment"; 
    let capturedDataUrl = null;
    let currentEventId = null;

    // GERENCIADOR DE TELA CHEIA E SUMIÇO DO TUTORIAL
    function entrarTelaCheiaETutorial() {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }

      // Desaparece suavemente
      tutorialOverlay.style.opacity = "0";
      setTimeout(() => {
        tutorialOverlay.style.visibility = "hidden";
      }, 400);
    }

    tutorialOverlay.addEventListener("click", entrarTelaCheiaETutorial);
    tutorialOverlay.addEventListener("touchstart", entrarTelaCheiaETutorial);

    function obterIdEventoUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("evento") || "festa-teste";
    }

    async function iniciarCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: false
        });
        videoFeed.srcObject = currentStream;
      } catch (err) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          videoFeed.srcObject = currentStream;
        } catch (e) {
          alert("Permita o acesso à câmera no seu navegador.");
        }
      }
    }

    btnFlip.addEventListener("click", () => {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      iniciarCamera();
    });

    async function carregarMolduraEvento() {
      currentEventId = obterIdEventoUrl();
      try {
        const eventRef = doc(db, "eventos", currentEventId);
        const eventSnap = await getDoc(eventRef);

        if (eventSnap.exists() && eventSnap.data().molduraUrl) {
          frameOverlay.src = eventSnap.data().molduraUrl;
          frameOverlay.style.display = "block";
        }
      } catch (err) {
        console.log("Sem moldura personalizada encontrada.");
      }
    }

    btnCapture.addEventListener("click", () => {
      const width = frameOverlay.naturalWidth || videoFeed.videoWidth || 1080;
      const height = frameOverlay.naturalHeight || videoFeed.videoHeight || 1920;

      photoCanvas.width = width;
      photoCanvas.height = height;

      const ctx = photoCanvas.getContext("2d");
      
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      if (facingMode === "user") {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }

      const vWidth = videoFeed.videoWidth || width;
      const vHeight = videoFeed.videoHeight || height;
      const scale = Math.max(width / vWidth, height / vHeight);
      const x = (width - vWidth * scale) / 2;
      const y = (height - vHeight * scale) / 2;

      ctx.drawImage(videoFeed, x, y, vWidth * scale, vHeight * scale);

      ctx.setTransform(1, 0, 0, 1, 0, 0);

      if (frameOverlay.src && frameOverlay.style.display !== "none") {
        ctx.drawImage(frameOverlay, 0, 0, width, height);
      }

      capturedDataUrl = photoCanvas.toDataURL("image/jpeg", 0.85);
      photoPreview.src = capturedDataUrl;
      photoPreview.style.display = "block";
      videoFeed.style.display = "none";

      controlsCapture.style.display = "none";
      controlsReview.style.display = "flex";
    });

    btnRetake.addEventListener("click", () => {
      capturedDataUrl = null;
      photoPreview.style.display = "none";
      videoFeed.style.display = "block";

      controlsCapture.style.display = "flex";
      controlsReview.style.display = "none";
    });

    btnSend.addEventListener("click", async () => {
      if (!capturedDataUrl) return;

      statusModal.style.display = "flex";
      statusSpinner.style.display = "block";
      statusTitle.innerText = "Enviando foto...";
      statusMessage.innerText = "Sua foto está indo para a fila de impressão!";
      btnCloseModal.style.display = "none";

      try {
        await addDoc(collection(db, "eventos", currentEventId, "fotos"), {
          fotoUrl: capturedDataUrl,
          status: "pendente",
          criadoEm: serverTimestamp()
        });

        statusSpinner.style.display = "none";
        statusTitle.innerText = "Foto Enviada! 🎉";
        statusMessage.innerText = "Sua foto já apareceu no painel de impressão.";
        btnCloseModal.style.display = "block";

      } catch (err) {
        console.error("Erro ao enviar:", err);
        statusSpinner.style.display = "none";
        statusTitle.innerText = "Erro ao Enviar";
        statusMessage.innerText = "Verifique a conexão e tente novamente.";
        btnCloseModal.style.display = "block";
      }
    });

    btnCloseModal.addEventListener("click", () => {
      statusModal.style.display = "none";
      btnRetake.click();
    });

    window.addEventListener("DOMContentLoaded", () => {
      iniciarCamera();
      carregarMolduraEvento();
    });
  </script>
</body>
</html>
